<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus 360 - Vendor Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .vendor-hero {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 3rem 2rem;
            border-radius: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .vendor-hero-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }
        .vendor-hero-info h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .vendor-hero-info .stats {
            display: flex;
            gap: 1.5rem;
            font-size: 1rem;
            color: #cbd5e1;
        }
        .vendor-hero-info .stats i {
            color: #fbbf24;
        }
        .review-section {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 2rem;
        }
        .review-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .review-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h2>Campus 360</h2>
                    <p>Student Platform</p>
                </div>
            </div>

            <div class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="marketplace.html" class="nav-item active">
                    <i class="fa-solid fa-store"></i> Marketplace
                </a>
                <!-- Other links omitted for brevity -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Top Navbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearch" placeholder="Search...">
                </div>

                <div class="topbar-actions">
                    <div class="user-profile" id="userProfileBtn">
                        <div class="avatar" id="navAvatar">U</div>
                        <div class="user-name" id="navName">User</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-container">
                <a href="marketplace.html" class="btn" style="margin-bottom: 1rem; display: inline-block;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Marketplace
                </a>

                <div class="vendor-hero">
                    <div class="vendor-hero-avatar" id="vendorAvatar">V</div>
                    <div class="vendor-hero-info">
                        <h1 id="vendorTitle">Loading...</h1>
                        <div class="stats">
                            <span><i class="fa-solid fa-star"></i> <span id="vendorRating">0.0</span> Rating</span>
                            <span><i class="fa-solid fa-comment"></i> <span id="vendorReviewCount">0</span> Reviews</span>
                        </div>
                    </div>
                </div>

                <h3>Active Listings by this Vendor</h3>
                <div class="marketplace-grid" id="vendorGrid">
                    <div class="loading-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </div>
                </div>

                <div class="review-section">
                    <h3>Leave a Review</h3>
                    <form class="review-form" id="reviewForm">
                        <div class="form-group">
                            <label>Rating (1-5)</label>
                            <input type="number" id="reviewRating" min="1" max="5" required>
                        </div>
                        <div class="form-group">
                            <label>Comment</label>
                            <textarea id="reviewComment" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: max-content;">Submit Review</button>
                    </form>

                    <h3>Recent Reviews</h3>
                    <div id="reviewsList">
                        <p style="color: #64748b;">Loading reviews...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/vendor-profile.js"></script>
</body>
</html>
