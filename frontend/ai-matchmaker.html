    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <style>
        .matchmaker-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .ai-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .ai-header h1 {
            font-size: 2.2rem;
            color: #1e3a8a;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .ai-header p {
            color: #64748b;
            font-size: 1.1rem;
        }
        .search-box-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-md, 12px);
            border: 1px solid var(--border-color, #e2e8f0);
            box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .search-field {
            flex: 1;
        }
        .search-field label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .search-field input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm, 8px);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .match-btn {
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm, 8px);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .match-btn:hover {
            opacity: 0.9;
        }
        .loading-container {
            text-align: center;
            padding: 3rem 0;
            display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #2563eb;
            font-weight: 500;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .student-card {
            background: white;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-md, 12px);
            padding: 1.25rem;
            position: relative;
            box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md, 0 4px 6px rgba(0,0,0,0.05));
        }
        .match-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #dcfce7;
            color: #166534;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }
        .student-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .student-meta {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
        }
        .skills-section {
            margin-bottom: 1rem;
        }
        .skills-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            display: block;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .skill-tag {
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }
        .ai-insight-box {
            background: #f5f3ff;
            border: 1px solid #e9d5ff;
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 1rem;
        }
        .ai-insight-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 0.15rem;
        }
        .ai-insight-text {
            font-size: 0.85rem;
            color: #4c1d95;
            line-height: 1.4;
        }
    </style>
</head>
