<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus 360 - AI Teammate Matchmaker</title>
  
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    
   
    <style>
        .matchmaker-box {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-md, 8px);
            border: 1px solid var(--border-color, #e2e8f0);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .search-field {
            flex: 1;
        }
        .search-field label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .search-field input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: var(--radius-sm, 6px);
            font-size: 1rem;
            outline: none;
        }
        .search-field input:focus {
            border-color: var(--primary-color, #2563eb);
        }
        .match-btn {
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm, 6px);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            height: 46px;
        }
        .loading-container {
            text-align: center;
            padding: 3rem 0;
            display: none;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .student-card {
            background: white;
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-md, 8px);
            padding: 1.25rem;
            position: relative;
            box-shadow: var(--shadow-sm);
        }
        .match-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #dcfce7;
            color: #166534;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }
        .student-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .student-meta {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.35rem;
        }
        .skill-tag {
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }
        .ai-insight-box {
            background: #f5f3ff;
            border: 1px solid #e9d5ff;
            border-radius: 6px;
            padding: 0.75rem;
            margin-top: 1rem;
        }
        .ai-insight-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 0.15rem;
        }
        .ai-insight-text {
            font-size: 0.85rem;
            color: #4c1d95;
            line-height: 1.4;
        }
    </style>
</head>
<body>

            <div class="sidebar-nav">

        <!-- Main Content -->
        <main class="main-content">
            
           
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search posts, people, materials...">
                </div>

                <div class="topbar-actions">
                    <div class="user-profile" id="userProfileBtn" style="cursor: pointer; position: relative;">
                        <div class="avatar" id="navAvatar">U</div>
                        <div class="user-name" id="navName">User</div>
                        <i class="fa-solid fa-chevron-down" style="color: #94a3b8; font-size: 0.8rem;"></i>
                        
                        
                        <div class="profile-dropdown" id="profileDropdown" style="display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 0.5rem 0; min-width: 150px; z-index: 100; margin-top: 0.5rem;">
                            <button id="logoutBtn" style="width: 100%; text-align: left; padding: 0.75rem 1rem; background: none; border: none; cursor: pointer; color: #ef4444; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
                            </button>
                        </div>
                    </div>
                </div>

            <div class="dashboard-container">
                <div class="page-header">
                    <h1>🧠 AI Teammate Matchmaker</h1>
                    <span>Find your perfect project partner</span>
                </div>

                
                <div class="matchmaker-box">
                    <div class="search-field">
                        <label for="skillInput">Which skill or role do you need for your team?</label>
                        <input type="text" id="skillInput" placeholder="e.g. React, SpringBoot, UI/UX, Python..." />
                    </div>
                    <button onclick="executeAiMatch()" class="match-btn">Find Matches</button>
                </div>

               
                <div id="loadingArea" class="loading-container">
