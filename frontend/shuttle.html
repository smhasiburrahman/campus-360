<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Shuttle Tracking - Campus 360</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/shuttle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- SockJS and STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h2>Campus 360</h2>
                    <p>Student Platform</p>
                </div>
            </div>

            <div class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="lost-found.html" class="nav-item">
                    <i class="fa-solid fa-magnifying-glass"></i> Lost & Found
                </a>
                <a href="announcements.html" class="nav-item">
                    <i class="fa-solid fa-bullhorn"></i> Announcements
                </a>
                <a href="events.html" class="nav-item">
                    <i class="fa-regular fa-calendar"></i> Events
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-flag"></i> Complaints
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-store"></i> Marketplace
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-book-open"></i> Study Zone
                </a>
                <a href="materials.html" class="nav-item">
                    <i class="fa-solid fa-folder-open"></i> Material Sharing
                </a>

                <div class="nav-section" style="margin-top: 2rem;">
                    <div class="nav-section-title">Other</div>
                    <a href="shuttle.html" class="nav-item active">
                        <i class="fa-solid fa-bus"></i> Shuttle Tracking
                    </a>
                    <a href="#" class="nav-item">
                        <i class="fa-regular fa-bell"></i> Notifications <span class="nav-badge">5</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i class="fa-regular fa-user"></i> My Profile
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Top Navbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search routes or stops...">
                </div>

                <div class="topbar-actions">
                    <div class="notification-bell">
                        <i class="fa-regular fa-bell"></i>
                    </div>
                    
                    <div class="user-profile" id="userProfileBtn" style="cursor: pointer; position: relative;">
                        <div class="avatar" id="navAvatar">U</div>
                        <div class="user-name" id="navName">User</div>
                        <i class="fa-solid fa-chevron-down" style="color: #94a3b8; font-size: 0.8rem;"></i>
                    </div>
                </div>
            </header>

            <div class="shuttle-container">
                <div class="map-wrapper">
                    <div id="map"></div>
                    
                    <!-- Floating Side Panel (Glassmorphism) -->
                    <div class="glass-panel">
                        <div class="glass-header">
                            <div class="live-dot"></div>
                            <h3>Active Routes</h3>
                        </div>
                        <div id="activeRoutesList" class="route-list">
                            <div style="text-align: center; color: var(--text-secondary); padding: 1rem;">
                                <i class="fa-solid fa-spinner fa-spin"></i> Loading trips...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/api.js"></script>
    <script src="js/shuttle.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';
    </script>
</body>
</html>
