spring.application.name=campus360

# Database Configuration
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/campus360?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Schema is managed manually (imported from campus360_schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Temporary fix for Spring AI 1.0.0-M1 compatibility with Spring Boot 4.1.1
spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
spring.main.allow-bean-definition-overriding=true

# JWT Secret (for development only, move to env vars for prod) - using a 512+ bit key
jwt.secret=vM7qlFhbNZstnOhd1IG3f7JJhtCKR9VTFd0E28772k6rkW871+YT1cVCnn5ABbF7fl2JPhGWQcxyzOSUcR0bew==
jwt.expirationMs=86400000

# Error Handling - Show helpful messages in error JSON responses
server.error.include-message=always
server.error.include-binding-errors=always

# Gemini AI Configuration (Course Planner)
gemini.api.key=Api_key_here
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.api.max-retries=2

# Gemini AI Configuration (AI Chatbot - Dedicated or Shared Key)
gemini.chatbot.api.key=${GEMINI_CHATBOT_API_KEY:${gemini.api.key}}
gemini.chatbot.api.url=${GEMINI_CHATBOT_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
gemini.chatbot.model=gemini-3.5-flash
gemini.chatbot.max-tokens=350

# Gemini AI Configuration (Lost & Found Matcher)
gemini.lostfound.api.key=${GEMINI_LOSTFOUND_API_KEY:${gemini.api.key}}
gemini.lostfound.api.url=${GEMINI_LOSTFOUND_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}

# Optional local overrides (gitignored)
spring.config.import=optional:application-local.properties

# File Upload Configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- PostgreSQL Vector DB Configuration ---
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# PostgreSQL Datasource (Secondary)
spring.datasource.vector.jdbc-url=jdbc:postgresql://localhost:5432/campus360_ai
spring.datasource.vector.username=postgres
spring.datasource.vector.password=postgres
spring.datasource.vector.driver-class-name=org.postgresql.Driver

# --- Local Embedding Model (ONNX) Configuration ---
spring.ai.embedding.transformer.onnx.model-uri=classpath:/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/tokenizer.json
